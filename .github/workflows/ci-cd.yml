name: ci-cd

on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time; never cancel a run mid-deploy.
concurrency:
  group: durable-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --locked

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # next.config.ts loads the env schema; typegen/typecheck run without a
      # populated environment (real validation happens at runtime).
      SKIP_ENV_VALIDATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: typegen (next-env.d.ts + route types)
        run: npx next typegen
      - name: typecheck
        run: npm run check:types
      - name: unit tests (vitest)
        run: npx vitest run --project unit

  # ITEM-111 AC3: a dependency with a licence we cannot ship fails the build.
  # The allow-lists live in deny.toml (Rust) and scripts/check-npm-licenses.mjs,
  # with the reasoning in LICENSES.md.
  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust licence audit (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: npm licence audit
        run: node scripts/check-npm-licenses.mjs

  # ITEM-083 AC4: the documented self-hosted install must actually start and
  # serve a request, so the guide cannot rot. Builds both images, uses a
  # throwaway compose project, and tears it down.
  self-hosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose profile validates
        run: docker compose --profile self-hosted config --quiet
      - name: Self-hosted install smoke (start, health, proxy a request)
        run: bash ./scripts/smoke-selfhosted.sh

  # The embedder is opt-in and needs a real artifact; run its gated tests
  # (latency + semantics) on the real model so the feature cannot rot.
  embedder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the embedder artifact
        run: bash ./scripts/fetch-embedder.sh > /dev/null
      - name: Embedder tests (real model)
        shell: bash
        run: |
          export EMBED_MODEL_PATH="$HOME/.cache/inferon/embedder/model_quantized.onnx"
          export EMBED_TOKENIZER_PATH="$HOME/.cache/inferon/embedder/tokenizer.json"
          export ORT_DYLIB_PATH="$(find "$HOME/.cache/inferon/embedder/ort/lib" -name 'libonnxruntime.so*' | head -1)"
          # ORT 1.19 + `load-dynamic` segfaults in its at-exit `ReleaseEnv` after the
          # harness finishes (the tests themselves pass, and the service shuts down
          # cleanly). Gate on the harness's own verdict, not the teardown exit code.
          set +e
          cargo test --features embedder --release -- \
            --include-ignored --test-threads=1 --nocapture embed_ 2>&1 | tee embed-tests.log
          status=${PIPESTATUS[0]}
          if grep -q "test result: ok" embed-tests.log; then
            echo "::notice::embedder tests passed; ignoring the known ORT teardown SIGSEGV"
            exit 0
          fi
          exit "$status"

  # ITEM-112: the docs site must build from `guides/` with no page moves. The host is
  # still a PO decision, so this publishes the artifact rather than deploying it —
  # attaching it to any candidate is a copy, not a build.
  docs-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned docs toolchain
        run: pip install -r requirements-docs.txt
      - name: Build (strict)
        run: mkdocs build --strict
      - name: The sales working documents are not published
        run: |
          # Named exactly: `11-cost-audit-findings` is a published guide, and a
          # substring match on "cost-audit" failed the build for it once.
          if find site \( -path '*inferon-cost-audit*' -o -path '*inferon-step2-materials*' \) | grep -q .; then
            echo "a sales document was published"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site

  # ITEM-112: the guides site, on GitHub Pages. `docs-site` builds and verifies;
  # this publishes what it built. The repo is public, so Pages is free and needs no
  # third party (Netlify was the recommendation while the repo was private).
  pages:
    needs: docs-site
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  # ITEM-113: a guide that links where a reader cannot follow, loses its
  # `Last verified` footer or drifts past the reading level fails the build.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guide check (links, footers, sections, reading level)
        run: python3 scripts/check-guides.py

  deploy:
    needs: [test, web, licences, docs]
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      INFERON_HOST: ${{ secrets.INFERON_HOST }}
      OPERATOR_API_KEY: ${{ secrets.OPERATOR_API_KEY }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      PROVIDER_ENCRYPTION_KEY: ${{ secrets.PROVIDER_ENCRYPTION_KEY }}
      UPSTREAM_MASTER_KEY: ${{ secrets.UPSTREAM_MASTER_KEY }}
      OPERATOR_GITHUB_LOGINS: ${{ secrets.OPERATOR_GITHUB_LOGINS }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      # Skipped (not failed) until the deploy secrets exist, so the chain is
      # green before the host/prereqs are wired up.
      - name: Check deploy prerequisites
        id: cfg
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::deploy skipped — set DEPLOY_HOST + DEPLOY_SSH_KEY (and INFERON_HOST/OPERATOR_API_KEY) repository secrets"
          fi

      - name: Package runtime bundle
        if: steps.cfg.outputs.configured == 'true'
        run: |
          tar czf /tmp/durable.tgz \
            --exclude='web/node_modules' --exclude='web/.next' \
            Cargo.toml Cargo.lock Dockerfile docker-compose.yml Caddyfile \
            .dockerignore .env.example LICENSE LICENSES.md CLA.md CONTRIBUTING.md \
            TRADEMARKS.md deny.toml mkdocs.yml requirements-docs.txt src scripts db web README.md guides

      - name: Install SSH key
        if: steps.cfg.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload bundle
        if: steps.cfg.outputs.configured == 'true'
        run: scp -i ~/.ssh/id_deploy /tmp/durable.tgz "root@$DEPLOY_HOST:/tmp/durable.tgz"

      # ITEM-153: the environment travels over stdin and lands in a 0600 file, never
      # on the command line — a deploy used to put every secret in the host's `ps`
      # output, and to lose them entirely when /opt/inferon was re-extracted.
      - name: Deploy (migrate + rebuild + restart)
        if: steps.cfg.outputs.configured == 'true'
        run: |
          {
            echo "INFERON_HOST=$INFERON_HOST"
            echo "NEXT_PUBLIC_APP_URL=https://$INFERON_HOST"
            echo "OPERATOR_API_KEY=$OPERATOR_API_KEY"
            echo "GITHUB_CLIENT_ID=$OAUTH_CLIENT_ID"
            echo "GITHUB_CLIENT_SECRET=$OAUTH_CLIENT_SECRET"
            echo "SESSION_SECRET=$SESSION_SECRET"
            echo "UPSTREAM_MASTER_KEY=$UPSTREAM_MASTER_KEY"
            echo "PROVIDER_ENCRYPTION_KEY=$PROVIDER_ENCRYPTION_KEY"
            echo "OPERATOR_GITHUB_LOGINS=$OPERATOR_GITHUB_LOGINS"
            echo "ALERT_WEBHOOK_URL=$ALERT_WEBHOOK_URL"
          } | ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "root@$DEPLOY_HOST" "\
            umask 077 && rm -rf /opt/inferon && mkdir -p /opt/inferon && tar xzf /tmp/durable.tgz -C /opt/inferon \
            && chmod -R a+rX /opt/inferon \
            && cat > /opt/inferon/env.local && chmod 600 /opt/inferon/env.local \
            && cd /opt/inferon && chmod +x scripts/*.sh \
            && docker compose up -d postgres redis \
            && ./scripts/migrate.sh \
            && set -a && . ./env.local && set +a \
            && docker compose --profile prod up -d --build \
            && docker compose --profile prod up -d --force-recreate caddy"

      - name: Health check
        if: steps.cfg.outputs.configured == 'true'
        run: |
          ssh -i ~/.ssh/id_deploy "root@$DEPLOY_HOST" \
            'for i in $(seq 1 90); do if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then echo stack-healthy; exit 0; fi; sleep 5; done; echo stack-health-failed; exit 1'

      - name: Performance claim (sub-ms proxy overhead)
        if: steps.cfg.outputs.configured == 'true'
        run: |
          ssh -i ~/.ssh/id_deploy "root@$DEPLOY_HOST" \
            'cd /opt/inferon && bash ./scripts/perf-check.sh'

      - name: Public landing check
        if: steps.cfg.outputs.configured == 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$INFERON_HOST/" | grep -q 'Inferon'; then
              echo "public landing ok"; exit 0
            fi
            sleep 5
          done
          echo "public landing check failed" >&2; exit 1
