services:
  proxy:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://inferon:inferon@postgres:5432/inferon
      UPSTREAM_URL: ${UPSTREAM_URL:-}
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_AUTHORIZE_URL: ${GITHUB_AUTHORIZE_URL:-}
      GITHUB_TOKEN_URL: ${GITHUB_TOKEN_URL:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      UPSTREAM_MASTER_KEY: ${UPSTREAM_MASTER_KEY:-}
      OPERATOR_GITHUB_LOGINS: ${OPERATOR_GITHUB_LOGINS:-}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/inferon", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inferon
      POSTGRES_PASSWORD: inferon
      POSTGRES_DB: inferon
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inferon -d inferon"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Lying-guarded-upstream mock for the smoke run (ITEM-027 AC3): answers
  # schema-violating SSE to cheap-tier guarded requests and schema-valid SSE
  # to the guard's frontier replay, 502 to everything else. Runs only under
  # the smoke profile — never part of a prod deployment.
  mock-upstream:
    build: .
    profiles: ["mock"]
    restart: "no"
    environment:
      PORT: 8090
      RUST_LOG: ${RUST_LOG:-info}
    command: ["--mock-upstream"]

  # Mock GitHub OAuth for the self-serve signup smoke (ITEM-036 AC4): same
  # binary in --mock-github mode — one fixed identity the smoke signs up twice
  # (fresh sign-in provisions, the repeat lands on the dashboard).
  github-mock:
    build: .
    profiles: ["mock"]
    restart: "no"
    ports:
      - "8091:8091"
    environment:
      PORT: 8091
      RUST_LOG: ${RUST_LOG:-info}
    command: ["--mock-github"]

  # Next.js human surfaces (ITEM-042e): landing, dashboard, operator console.
  # Server-side data calls go straight to the Rust proxy on the compose network
  # (INFERON_API_URL); browser calls use the public origin via Caddy.
  web:
    build: ./web
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      INFERON_API_URL: http://proxy:8080
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      NEXT_TELEMETRY_DISABLED: "1"
    # Loopback-only: the container is reached via Caddy on the compose network.
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  # TLS ingress for the public hostname (ITEM-014c); enabled via --profile prod.
  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${INFERON_HOST:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - proxy
      - web

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
