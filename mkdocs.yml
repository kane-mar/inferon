# The documentation site (ITEM-112). `guides/` is the docs directory, so a page is
# written once: it is what GitHub renders and what this builds. The two sales working
# documents are excluded, not copied elsewhere.
site_name: Inferon
site_description: One OpenAI-compatible endpoint in front of every model, with true cost numbers and cost protection.
docs_dir: guides
# site_url is set when the host is chosen (ITEM-112 is blocked on that decision); the
# build does not need it, but search canonical links improve once it is filled in.
# site_url: https://docs.inferon.agilefederation.com/

exclude_docs: |
  inferon-cost-audit.md
  inferon-step2-materials.md

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Start here: README.md
  - Getting started:
      - Your first request: using/first-request.md
      - Move an existing SDK: using/move-an-sdk.md
  - Configuration:
      - Add your own provider: config/01-providers.md
      - Models and cheaper pairs: config/02-models-and-tier-pairs.md
      - The output checker: config/03-output-checker.md
      - The automatic router: config/04-auto-router-and-threshold.md
      - Budgets and rate limits: config/05-budgets-and-rate-limits.md
      - A fallback chain that fires: config/06-fallback-chain.md
      - Prompt caching: config/07-prompt-caching.md
      - Pruning and the comparison group: config/08-pruning-and-comparison.md
      - Payloads, retention and PII: config/09-payloads-retention-pii.md
      - Datasets, gold sets and evals: config/10-datasets-gold-sets-evals.md
      - The cost audit's findings: config/11-cost-audit-findings.md
      - Spend and sessions: config/12-sessions-and-spend.md
  - Troubleshooting:
      - '401 or 403: the key is not accepted': troubleshooting/401-403.md
      - 'no_provider: nowhere to send the request': troubleshooting/no-provider.md
      - '429: our limit, or the provider''s': troubleshooting/too-many-requests.md
      - '5xx and the fallback chain': troubleshooting/upstream-5xx.md
      - Empty, refused or cut short: troubleshooting/empty-refused-truncated.md
      - Quality dropped after a downgrade: troubleshooting/quality-dropped.md
      - A provider that tests as unreachable: troubleshooting/provider-unreachable.md
      - The dashboard is empty: troubleshooting/dashboard-empty.md
      - The audit shows zero: troubleshooting/audit-shows-zero.md
      - A sign-in loop: troubleshooting/sign-in-loop.md
      - 502 from Caddy: troubleshooting/caddy-502.md
      - Migrations did not apply: troubleshooting/migrations-not-applied.md
      - Payloads were purged: troubleshooting/payloads-purged.md
  - Run it yourself:
      - Inferon on your own network: inferon-self-hosted.md
  - Licence:
      - What you may do: licence.md

# The guides themselves are CC BY-4.0; the code they describe is AGPL-3.0-only.
# MkDocs Material prints this line in the footer of every page.
copyright: >-
  Code: AGPL-3.0-only · These guides: CC BY-4.0 · Inferon is a trademark of Kane Mar

# A new page must appear here as well as in guides/README.md; the nav is the site's
# table of contents and MkDocs fails the build when a nav entry points at no file.
