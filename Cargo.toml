[package]
name = "inferon"
version = "0.1.0"
edition = "2021"

[features]
# ITEM-028: the ONNX Runtime embedder is an opt-in build. The default build
# (and the macOS TDD loop) never compiles/links ORT; the Linux host builds the
# feature and ships the runtime library in the image (See src/embed.rs).
embedder = ["dep:ort", "dep:tokenizers"]

[dependencies]
axum = { version = "0.7", features = ["macros", "tokio"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "io-util"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
serde_json = "1.0"
futures-util = "0.3"
async-stream = "0.3"
async-trait = "0.1"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "rust_decimal"] }
uuid = { version = "1", features = ["v4", "serde"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonschema = "0.54.0"
# At-rest encryption for provider credentials (ITEM-043): XChaCha20-Poly1305,
# pure Rust (no C toolchain), keyed by PROVIDER_ENCRYPTION_KEY.
chacha20poly1305 = "0.10"
# Optional (feature `embedder`): ONNX Runtime + tokenizer for the prompt
# embedder. `load-dynamic` keeps the crate link-free, so this type-checks on
# any platform and only loads libonnxruntime at runtime (see src/embed.rs).
#
# `api-19`, not the newest API: ONNX Runtime 1.19.2 is the newest macOS x86_64
# build that still targets macOS 11 (newer ones need macOS 13 libc++ symbols), so
# the dev loop runs the real artifact instead of only type-checking. Linux x64
# ships 1.19.2 too. `scripts/fetch-embedder.sh` downloads it.
ort = { version = "2.0.0-rc.13", optional = true, default-features = false, features = ["load-dynamic", "ndarray", "tracing", "api-19"] }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
