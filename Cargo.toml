[package]
name = "inferon"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "tokio"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "io-util"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
serde_json = "1.0"
futures-util = "0.3"
async-stream = "0.3"
async-trait = "0.1"
hex = "0.4"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid"] }
uuid = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
